<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pergaminho">
        <h1>Grimório de personagens</h1>
        <h2>Escolha seu personagem:</h2>
        <div id="characters-list"></div>
        <hr id="linha">
        <h2>Ou busque pelo nome:</h2>
        <input type="text" id="input-name" placeholder="Ex: Sollux">
        <button id="buscar" onclick="buscar()">Buscar</button>
        <div id="mensagem_erro"></div>
    </div>
    <script>
        window.onload = function(){
            fetch("/personagens")
            .then(resposta => resposta.json())
            .then(dados =>{console.log(dados)
                for (const character of dados)
                document.getElementById("characters-list").innerHTML += `<button onclick="window.location.href='ficha.html?personagem=${character}'">${character}</button>`
            })
        }


        function buscar(){
            const nome_ficha = document.getElementById("input-name").value
            fetch(`personagem/${nome_ficha}`)
            .then(resposta =>{
                if (!resposta.ok){
                    document.getElementById("mensagem_erro").textContent = "Personagem não encontrado!"
                    return
                }
                window.location.href = `ficha.html?personagem=${nome_ficha}`
            })

        }
        </script>
</body>
</html>
